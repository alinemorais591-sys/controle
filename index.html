<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f2f2f2;
    color: #1a1a1a;
    padding-bottom: 80px;
  }
  header {
    background: #111;
    color: #fff;
    padding: 20px 16px 16px;
    text-align: center;
  }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.3px; }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }

  .tabs {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: #111;
    z-index: 100;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: #999;
    padding: 14px 4px;
    font-size: 12px;
    cursor: pointer;
  }
  .tab-btn.active { color: #fff; font-weight: 600; border-top: 2px solid #fff; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    border: 1px solid #e0e0e0;
  }
  .card h2 { font-size: 14px; margin-bottom: 12px; color: #333; text-transform: uppercase; letter-spacing: 0.5px;}

  label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
  select, input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    background: #fafafa;
  }
  .radio-group { display: flex; gap: 8px; margin-top: 6px; }
  .radio-group button {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fafafa;
    font-size: 14px;
    cursor: pointer;
  }
  .radio-group button.selected { background: #111; color: #fff; border-color: #111; }

  .btn-primary {
    width: 100%;
    background: #111;
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 16px;
    cursor: pointer;
  }
  .btn-primary:active { background: #333; }

  .entry-item, .das-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }
  .entry-item:last-child, .das-item:last-child { border-bottom: none; }
  .entry-left { display: flex; flex-direction: column; }
  .entry-value { font-weight: 600; font-size: 15px; }
  .entry-sub { font-size: 12px; color: #888; }
  .nota-toggle {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    border: 1px solid #ccc;
    background: #fff;
    cursor: pointer;
  }
  .nota-toggle.ok { background: #111; color: #fff; border-color: #111; }

  .cat-group { margin-bottom: 10px; }
  .cat-title { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 4px; text-transform: capitalize;}
  .cat-total { float: right; color: #888; font-weight: 400; }

  .summary-grid { display: flex; gap: 10px; margin-bottom: 14px; }
  .summary-box {
    flex: 1;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .summary-box .label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .summary-box .value { font-size: 18px; font-weight: 700; }

  .empty { text-align: center; color: #aaa; font-size: 13px; padding: 20px 0; }

  .das-row { display: flex; gap: 8px; }
  .das-row > div { flex: 1; }

  .delete-btn {
    background: none; border: none; color: #bbb; font-size: 16px; cursor: pointer; padding: 0 4px;
  }
</style>
</head>
<body>

<header>
  <h1>Controle Financeiro</h1>
</header>

<div class="container">

  <!-- ABA 1: LANÇAMENTO -->
  <div id="tab1" class="tab-content active">
    <div class="card">
      <h2>Novo Lançamento</h2>

      <label>Tipo</label>
      <div class="radio-group">
        <button type="button" class="selected" id="btnEntrada" onclick="setTipo('entrada')">Entrada</button>
        <button type="button" id="btnDespesa" onclick="setTipo('despesa')">Despesa</button>
      </div>

      <label>Valor (R$)</label>
      <input type="number" id="valor" placeholder="0,00" step="0.01">

      <div id="campoClinica">
        <label>Clínica</label>
        <select id="clinica">
          <option value="Viamão">Viamão</option>
          <option value="Esteio">Esteio</option>
        </select>
      </div>

      <div id="campoCategoria" style="display:none;">
        <label>Categoria</label>
        <input type="text" id="categoria" placeholder="Ex: comida, transporte...">
      </div>

      <label>Data</label>
      <input type="date" id="data">

      <button class="btn-primary" onclick="salvarLancamento()">Salvar</button>
    </div>
  </div>

  <!-- ABA 2: RELATÓRIO -->
  <div id="tab2" class="tab-content">
    <div class="card">
      <h2>Entradas por Clínica</h2>
      <div id="listaEntradas"></div>
    </div>
    <div class="card">
      <h2>Despesas por Categoria</h2>
      <div id="listaDespesas"></div>
    </div>
  </div>

  <!-- ABA 3: RESUMO + DAS -->
  <div id="tab3" class="tab-content">
    <div class="summary-grid">
      <div class="summary-box">
        <div class="label">Entradas</div>
        <div class="value" id="totalEntradas">R$ 0</div>
      </div>
      <div class="summary-box">
        <div class="label">Despesas</div>
        <div class="value" id="totalDespesas">R$ 0</div>
      </div>
      <div class="summary-box">
        <div class="label">Saldo</div>
        <div class="value" id="saldo">R$ 0</div>
      </div>
    </div>

    <div class="card">
      <h2>Controle do DAS</h2>
      <div class="das-row">
        <div>
          <label>Mês</label>
          <input type="month" id="dasMes">
        </div>
        <div>
          <label>Valor (R$)</label>
          <input type="number" id="dasValor" step="0.01">
        </div>
      </div>
      <label>Status</label>
      <div class="radio-group">
        <button type="button" class="selected" id="btnDasPendente" onclick="setDasStatus(false)">Pendente</button>
        <button type="button" id="btnDasPago" onclick="setDasStatus(true)">Pago</button>
      </div>
      <button class="btn-primary" onclick="salvarDas()">Salvar DAS</button>
    </div>

    <div class="card">
      <h2>Histórico DAS</h2>
      <div id="listaDas"></div>
    </div>
  </div>

</div>

<div class="tabs">
  <button class="tab-btn active" id="tabBtn1" onclick="showTab(1)">Lançar</button>
  <button class="tab-btn" id="tabBtn2" onclick="showTab(2)">Relatório</button>
  <button class="tab-btn" id="tabBtn3" onclick="showTab(3)">Resumo / DAS</button>
</div>

<script>
  let tipoAtual = 'entrada';
  let dasStatusAtual = false;

  function todayStr() {
    const d = new Date();
    return d.toISOString().split('T')[0];
  }
  document.getElementById('data').value = todayStr();

  function setTipo(tipo) {
    tipoAtual = tipo;
    document.getElementById('btnEntrada').classList.toggle('selected', tipo === 'entrada');
    document.getElementById('btnDespesa').classList.toggle('selected', tipo === 'despesa');
    document.getElementById('campoClinica').style.display = tipo === 'entrada' ? 'block' : 'none';
    document.getElementById('campoCategoria').style.display = tipo === 'despesa' ? 'block' : 'none';
  }

  function setDasStatus(pago) {
    dasStatusAtual = pago;
    document.getElementById('btnDasPendente').classList.toggle('selected', !pago);
    document.getElementById('btnDasPago').classList.toggle('selected', pago);
  }

  function getLancamentos() {
    return JSON.parse(localStorage.getItem('lancamentos') || '[]');
  }
  function saveLancamentos(arr) {
    localStorage.setItem('lancamentos', JSON.stringify(arr));
  }
  function getDas() {
    return JSON.parse(localStorage.getItem('das') || '[]');
  }
  function saveDasList(arr) {
    localStorage.setItem('das', JSON.stringify(arr));
  }

  function salvarLancamento() {
    const valor = parseFloat(document.getElementById('valor').value);
    const data = document.getElementById('data').value;
    if (!valor || valor <= 0) { alert('Digite um valor válido'); return; }
    if (!data) { alert('Selecione a data'); return; }

    const item = {
      id: Date.now(),
      tipo: tipoAtual,
      valor: valor,
      data: data,
      nota: false
    };

    if (tipoAtual === 'entrada') {
      item.clinica = document.getElementById('clinica').value;
    } else {
      const cat = document.getElementById('categoria').value.trim();
      if (!cat) { alert('Digite a categoria'); return; }
      item.categoria = cat.toLowerCase();
    }

    const arr = getLancamentos();
    arr.push(item);
    saveLancamentos(arr);

    document.getElementById('valor').value = '';
    document.getElementById('categoria').value = '';
    alert('Lançamento salvo!');
    renderAll();
  }

  function toggleNota(id) {
    const arr = getLancamentos();
    const item = arr.find(i => i.id === id);
    if (item) item.nota = !item.nota;
    saveLancamentos(arr);
    renderAll();
  }

  function deletarItem(id) {
    if (!confirm('Excluir este lançamento?')) return;
    let arr = getLancamentos();
    arr = arr.filter(i => i.id !== id);
    saveLancamentos(arr);
    renderAll();
  }

  function formatMoney(v) {
    return 'R$ ' + v.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }

  function renderRelatorio() {
    const arr = getLancamentos();
    const entradas = arr.filter(i => i.tipo === 'entrada').sort((a,b) => b.id - a.id);
    const despesas = arr.filter(i => i.tipo === 'despesa').sort((a,b) => b.id - a.id);

    const listaEntradas = document.getElementById('listaEntradas');
    if (entradas.length === 0) {
      listaEntradas.innerHTML = '<div class="empty">Nenhuma entrada ainda</div>';
    } else {
      listaEntradas.innerHTML = entradas.map(e => `
        <div class="entry-item">
          <div class="entry-left">
            <span class="entry-value">${formatMoney(e.valor)}</span>
            <span class="entry-sub">${e.clinica} · ${new Date(e.data+'T00:00').toLocaleDateString('pt-BR')}</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button class="nota-toggle ${e.nota ? 'ok' : ''}" onclick="toggleNota(${e.id})">${e.nota ? '✓ Nota emitida' : 'Sem nota'}</button>
            <button class="delete-btn" onclick="deletarItem(${e.id})">✕</button>
          </div>
        </div>
      `).join('');
    }

    const listaDespesas = document.getElementById('listaDespesas');
    if (despesas.length === 0) {
      listaDespesas.innerHTML = '<div class="empty">Nenhuma despesa ainda</div>';
    } else {
      const porCategoria = {};
      despesas.forEach(d => {
        if (!porCategoria[d.categoria]) porCategoria[d.categoria] = [];
        porCategoria[d.categoria].push(d);
      });
      listaDespesas.innerHTML = Object.keys(porCategoria).map(cat => {
        const items = porCategoria[cat];
        const total = items.reduce((s,i) => s + i.valor, 0);
        return `
          <div class="cat-group">
            <div class="cat-title">${cat} <span class="cat-total">${formatMoney(total)}</span></div>
            ${items.map(i => `
              <div class="entry-item">
                <div class="entry-left">
                  <span class="entry-value">${formatMoney(i.valor)}</span>
                  <span class="entry-sub">${new Date(i.data+'T00:00').toLocaleDateString('pt-BR')}</span>
                </div>
                <button class="delete-btn" onclick="deletarItem(${i.id})">✕</button>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    }
  }

  function renderResumo() {
    const arr = getLancamentos();
    const totalEntradas = arr.filter(i => i.tipo === 'entrada').reduce((s,i) => s + i.valor, 0);
    const totalDespesas = arr.filter(i => i.tipo === 'despesa').reduce((s,i) => s + i.valor, 0);
    document.getElementById('totalEntradas').textContent = formatMoney(totalEntradas);
    document.getElementById('totalDespesas').textContent = formatMoney(totalDespesas);
    document.getElementById('saldo').textContent = formatMoney(totalEntradas - totalDespesas);
  }

  function salvarDas() {
    const mes = document.getElementById('dasMes').value;
    const valor = parseFloat(document.getElementById('dasValor').value);
    if (!mes) { alert('Selecione o mês'); return; }
    if (!valor || valor <= 0) { alert('Digite um valor válido'); return; }

    let arr = getDas();
    arr = arr.filter(d => d.mes !== mes);
    arr.push({ id: Date.now(), mes, valor, pago: dasStatusAtual });
    saveDasList(arr);

    document.getElementById('dasValor').value = '';
    alert('DAS salvo!');
    renderDas();
  }

  function toggleDasPago(id) {
    const arr = getDas();
    const item = arr.find(i => i.id === id);
    if (item) item.pago = !item.pago;
    saveDasList(arr);
    renderDas();
  }

  function deletarDas(id) {
    if (!confirm('Excluir este registro de DAS?')) return;
    let arr = getDas();
    arr = arr.filter(i => i.id !== id);
    saveDasList(arr);
    renderDas();
  }

  function renderDas() {
    const arr = getDas().sort((a,b) => b.mes.localeCompare(a.mes));
    const lista = document.getElementById('listaDas');
    if (arr.length === 0) {
      lista.innerHTML = '<div class="empty">Nenhum registro ainda</div>';
      return;
    }
    lista.innerHTML = arr.map(d => {
      const [ano, mes] = d.mes.split('-');
      const nomesMes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
      const mesNome = nomesMes[parseInt(mes)-1] + '/' + ano;
      return `
        <div class="das-item">
          <div class="entry-left">
            <span class="entry-value">${mesNome}</span>
            <span class="entry-sub">${formatMoney(d.valor)}</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button class="nota-toggle ${d.pago ? 'ok' : ''}" onclick="toggleDasPago(${d.id})">${d.pago ? '✓ Pago' : 'Pendente'}</button>
            <button class="delete-btn" onclick="deletarDas(${d.id})">✕</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderAll() {
    renderRelatorio();
    renderResumo();
    renderDas();
  }

  function showTab(n) {
    for (let i = 1; i <= 3; i++) {
      document.getElementById('tab'+i).classList.toggle('active', i === n);
      document.getElementById('tabBtn'+i).classList.toggle('active', i === n);
    }
    if (n === 2) renderRelatorio();
    if (n === 3) { renderResumo(); renderDas(); }
  }

  renderAll();
</script>

</body>
</html>
